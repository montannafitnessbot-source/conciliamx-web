<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias - ConciliaMx</title>
    <meta name="description" content="Gracias por escribirnos. El equipo de ConciliaMx te responderá pronto.">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --azul: #0a1628;
            --azul-claro: #152238;
            --verde: #10b981;
            --verde-oscuro: #059669;
            --plata: #c0c0c0;
            --blanco: #ffffff;
            --gris: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--azul);
            color: var(--blanco);
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            background: rgba(10, 22, 40, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .logo-text span:first-child { color: var(--verde); }
        .logo-text span:last-child { color: var(--plata); }
        nav a {
            color: var(--gris);
            text-decoration: none;
            margin-left: 24px;
            transition: color 0.3s;
        }
        nav a:hover { color: var(--verde); }
        .gracias {
            padding: 100px 0 80px;
            text-align: center;
            background: radial-gradient(ellipse at top, var(--azul-claro) 0%, var(--azul) 70%);
            min-height: 70vh;
        }
        .gracias h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--blanco), var(--plata));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gracias p {
            font-size: 1.25rem;
            color: var(--gris);
            max-width: 700px;
            margin: 0 auto 40px;
        }
        .check-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--verde), var(--verde-oscuro));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 32px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }
        .btn-primary {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, var(--verde), var(--verde-oscuro));
            color: var(--blanco);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.5);
        }
        @media (max-width: 768px) {
            .gracias h1 { font-size: 2rem; }
            .gracias p { font-size: 1rem; }
            nav { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <img src="logo.png" alt="ConciliaMx" width="45" height="45" loading="eager" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover;">
                <div class="logo-text">
                    <span>Concilia</span><span>Mx</span>
                </div>
            </div>
            <nav>
                <a href="/">Volver al inicio</a>
            </nav>
        </div>
    </header>
    <section class="gracias">
        <div class="container">
            <div class="check-icon">✓</div>
            <h1>¡Gracias por escribirnos!</h1>
            <p>Tu mensaje ya se envió. Te responderemos lo antes posible al correo que nos compartiste.</p>
            <a href="/" class="btn-primary">Volver al inicio</a>
        </div>
    </section>
    <footer style="padding: 40px 0; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); color: var(--gris);">
        <div class="container">
            <p>2026 ConciliaMx. Todos los derechos reservados.</p>
            <p>Bot oficial: <a href="https://t.me/conciliacionMx" style="color: var(--verde); text-decoration: none;">@conciliacionMx</a></p>
        </div>
    </footer>
</body>
</html>
